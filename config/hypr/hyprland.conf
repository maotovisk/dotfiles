################
### MONITORS ###
################
monitorv2 {
  output = DP-1
  mode = 1920x1080@180
  position = 0x0
  scale = 1
}

monitorv2 {
  output = DP-2
  mode = 1920x1080@144
  position = 1920x0
  scale = 1
}

workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-2
exec-once = xrandr --output DP-1 --primary

####################
### Default Apps ###
####################
$terminal    = kitty
$fileManager = dolphin
$menu        = wofi --show drun
$browser     = zen-browser

##############
### NVIDIA ###
##############
cursor {
  no_hardware_cursors = 0
  use_cpu_buffer      = true
}

#################
### AUTOSTART ###
#################
exec-once = nm-applet
exec-once = hypridle
exec-once = waybar & hyprpaper & mako
exec-once = systemctl --user start hyprpolkitagent

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

## NVIDIA Specific
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = GDK_BACKEND,wayland,x11,*
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

## Wayland / Toolkit
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_MENU_PREFIX,plasma-
env = XDG_SESSION_TYPE,wayland
env = SDL_VIDEODRIVER,wayland
env = GSK_RENDERER,ngl

## JetBrains Rider workaround (EF tools)
env = PATH,"$PATH:$HOME/.dotnet/tools/"

#####################
### LOOK AND FEEL ###
#####################
general {
  gaps_in            = 4
  gaps_out           = 8
  border_size        = 1
  col.active_border  = rgba(5259aaa8)
  col.inactive_border= rgba(585858a8)
  resize_on_border   = true
  allow_tearing      = true
  layout             = dwindle
}

decoration {
  rounding = 8

  # Subtle translucent + soft shadow (macOS‑like)
  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  blur {
    enabled = true
    size = 12
    passes = 2
    new_optimizations = true
    brightness = 0.95
    contrast = 1.05
    noise = 0.02
    vibrancy = 0.15
    vibrancy_darkness = 0.60
    ignore_opacity = false
  }

  shadow {
    enabled = true
    range = 20
    render_power = 10
    color = rgba(0000009a)
  }
}


animations {
  enabled = true

  bezier = easeOut,        0.40, 0.00, 0.20, 1.00
  bezier = easeInOut,      0.42, 0.05, 0.25, 0.99
  bezier = gentle,         0.25, 0.10, 0.25, 1.00
  bezier = springLite,     0.34, 1.35, 0.60, 1.00
  bezier = fadeCurve,      0.30, 0.00, 0.15, 1.00
  bezier = wsSlide,        0.46, 0.03, 0.25, 0.99

  animation = windows,        1, 5, easeOut, slide
  animation = windowsOut,     1, 4, easeInOut, slide
  animation = border,         1, 12, gentle
  animation = fade,           1, 6, fadeCurve
  animation = workspaces,     1, 5, wsSlide, slide
  animation = specialWorkspace, 1, 5, easeInOut, slidevert

  animation = layers,         1, 6, easeOut, fade
  animation = layersOut,      1, 5, easeInOut, fade
}

dwindle {
  pseudotile      = true
  preserve_split  = true
}

master {
  new_status = master
}

misc {
  force_default_wallpaper = 0
  enable_anr_dialog       = false
  disable_hyprland_logo   = false
  vfr                     = 0
  vrr                     = 0
}

render {
  direct_scanout          = true
  new_render_scheduling   = true
}

#############
### INPUT ###
#############
input {
  kb_layout  = us,br
  kb_variant = intl,abnt2
  kb_options = grp:rctrl_toggle

  follow_mouse = 1
  accel_profile = flat
  sensitivity = -0.5

  touchpad {
    natural_scroll = false
  }
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

## warp toggle
bind = $mainMod SHIFT, C, exec, /home/maoto/.local/bin/toggle-warp

## reload waybar
bind = $mainMod SHIFT, Z, exec, pkill waybar && waybar

## screenshot and upload to s-ul
bind = $mainMod SHIFT, S, exec, /home/maoto/.local/bin/sul-uploader
bind = $mainMod SHIFT, G, exec, /home/maoto/.local/bin/osu-gamma

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, M, exec, swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit Hyprland? This will end your Wayland session.' -b 'Yes, exit Hyprland' 'hyprctl dispatch exit'
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen,

# Move focus with mainMod + arrow keys
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move/resize windows with mainMod + LMB/RMB
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = ALT, Tab, cyclenext, hist
bind = ALT, Tab, bringactivetotop

##############################
### WINDOWS AND WORKSPACES ###
##############################
windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

### Tearing for Games
windowrule = immediate, fullscreenstate: * 2

### Jetbrains IDEs fix.
windowrule = noinitialfocus,class:jetbrains-toolbox, floating:1
windowrule = noinitialfocus, class:(jetbrains-)(.*), title:^win(.*)
windowrule = size 672 700,class:(jetbrains-)(.*),title:^$,floating:1

## Firefox/Zen PiP
windowrule = float, title:(.*)(Picture-in-Picture)

windowrule = noscreenshare, initialClass:(vesktop)

### osu! editor rules
windowrule = noinitialfocus, class:(osu!.exe), title:^$, initialTitle:^$, floating:1
windowrule = stayfocused, class:(osu!.exe), title:(.*)(Rotate by), floating:1
windowrule = stayfocused, class:(osu!.exe), title:(.*)(Scale by), floating:1
windowrule = stayfocused, class:(osu!.exe), title:(.*)(Polygonal Circle Creation), floating:1
windowrule = stayfocused, class:(osu!.exe), title:(.*)(Timing and Control Points), floating:1

### gpu screen recorder
windowrule = noblur, title:(gsr ui)
windowrule = stayfocused, title:(gsr ui)
windowrule = noanim, title:(satty)

### kde portal popup
windowrule = float, class:(org.freedesktop.impl.portal.desktop.kde)

### wofi animation
layerrule = animation slidevert, wofi
layerrule = animation slidevert, waybar
layerrule = blur, wofi
